<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ساحة الألعاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0a1e;
  --bg2:#141033;
  --panel:#1b1640;
  --panel2:#241d54;
  --cyan:#2be6d8;
  --pink:#ff5d8f;
  --amber:#ffcd3c;
  --violet:#8b7bff;
  --text:#f3f1ff;
  --muted:#a49bd6;
  --danger:#ff5d5d;
  --good:#3fe08a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow-x:hidden;}
body{
  background:
    radial-gradient(circle at 15% 0%, #2a1f6b 0%, transparent 45%),
    radial-gradient(circle at 100% 20%, #3a1550 0%, transparent 40%),
    var(--bg);
  color:var(--text);
  font-family:'Cairo',sans-serif;
  min-height:100vh;
  user-select:none;
}
h1,h2,h3,.display{font-family:'Baloo Bhaijaan 2',sans-serif;}
button{font-family:'Cairo',sans-serif;}

/* ---------- HOME ---------- */
#app{max-width:1100px;margin:0 auto;padding:18px 16px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .logo{
  width:46px;height:46px;border-radius:14px;
  background:linear-gradient(135deg,var(--cyan),var(--violet));
  display:flex;align-items:center;justify-content:center;font-size:24px;
  box-shadow:0 6px 18px rgba(43,230,216,.35);
}
.brand h1{font-size:22px;margin:0;font-weight:800;letter-spacing:.5px;}
.brand span{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:-2px;}

.tabs{display:flex;gap:8px;margin:18px 0 16px;overflow-x:auto;padding-bottom:4px;}
.tab{
  flex:0 0 auto;padding:9px 18px;border-radius:999px;border:2px solid transparent;
  background:var(--panel);color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;
  transition:transform .15s ease, background .2s ease, color .2s ease;white-space:nowrap;
}
.tab.active{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#0c0a1e;}
.tab:active{transform:scale(.95);}

.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;
}
.card{
  background:var(--panel);border-radius:20px;padding:14px 10px 12px;text-align:center;
  cursor:pointer;position:relative;overflow:hidden;
  border:2px solid rgba(255,255,255,.05);
  transition:transform .15s ease, border-color .2s ease;
}
.card:active{transform:scale(.94);}
.card .icon-tile{
  width:64px;height:64px;margin:0 auto 10px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;font-size:32px;
  box-shadow:0 8px 16px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.08);
}
.card h3{font-size:14.5px;margin:0 0 6px;font-weight:700;line-height:1.25;min-height:36px;display:flex;align-items:center;justify-content:center;}
.tag{
  display:inline-block;font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:999px;
  color:#0c0a1e;letter-spacing:.2px;
}
.tag.single{background:var(--cyan);}
.tag.two{background:var(--pink);}
.tag.both{background:var(--amber);}
.card .best{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.35);color:var(--amber);
  font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:8px;}

/* ---------- GAME SCREEN ---------- */
#gameScreen{
  position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
}
#gameScreen.open{transform:translateY(0);}
.game-topbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;background:var(--panel);border-bottom:2px solid rgba(255,255,255,.06);
  flex:0 0 auto;
}
#backBtn{
  background:var(--panel2);color:var(--text);border:none;border-radius:12px;
  padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;
}
#backBtn:active{transform:scale(.95);}
#gameTitle{font-size:17px;font-weight:800;margin:0;flex:1;text-align:center;}
#scoreDisplay{font-size:13px;font-weight:800;color:var(--amber);min-width:40px;text-align:left;}
#howBtn{
  width:34px;height:34px;border-radius:50%;border:none;background:var(--panel2);color:var(--amber);
  font-weight:800;font-size:16px;cursor:pointer;flex:0 0 auto;
}
#howBtn:active{transform:scale(.9);}
#howOverlay{
  position:fixed;inset:0;background:rgba(6,4,20,.82);backdrop-filter:blur(4px);
  z-index:110;display:none;align-items:center;justify-content:center;padding:20px;
}
#howOverlay.show{display:flex;}
#howText{color:var(--muted);font-size:14px;font-weight:600;}

#gameContainer{
  flex:1;position:relative;overflow:auto;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;padding:14px;gap:10px;
}

/* ---------- RESULT OVERLAY ---------- */
#resultOverlay{
  position:fixed;inset:0;background:rgba(6,4,20,.82);backdrop-filter:blur(4px);
  z-index:100;display:none;align-items:center;justify-content:center;padding:20px;
}
#resultOverlay.show{display:flex;}
.result-card{
  background:var(--panel);border-radius:24px;padding:28px 24px;text-align:center;max-width:340px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  animation:pop .3s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
.result-card .emoji{font-size:52px;margin-bottom:6px;}
.result-card h2{margin:0 0 6px;font-size:22px;}
.result-card p{margin:0 0 20px;color:var(--muted);font-size:14px;font-weight:600;}
.result-btns{display:flex;gap:10px;}
.btn{
  flex:1;border:none;border-radius:14px;padding:13px 10px;font-weight:800;font-size:14.5px;cursor:pointer;
}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#0c0a1e;}
.btn-secondary{background:var(--panel2);color:var(--text);}
.btn:active{transform:scale(.95);}

/* ---------- SHARED GAME UI HELPERS ---------- */
.pill-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.info-pill{background:var(--panel2);padding:8px 16px;border-radius:12px;font-weight:800;font-size:13px;}
.info-pill b{color:var(--amber);}
.grid-box{display:grid;gap:8px;}
.tile-btn{
  border:none;border-radius:14px;background:var(--panel2);color:var(--text);
  font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .1s ease, background .15s ease;
}
.tile-btn:active{transform:scale(.92);}
.hidden{display:none !important;}
canvas{border-radius:16px;background:var(--panel2);touch-action:none;max-width:100%;}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:6px;}
.dpad button{border:none;border-radius:12px;background:var(--panel2);color:var(--text);font-size:22px;font-weight:800;cursor:pointer;}
.dpad button:active{transform:scale(.9);background:var(--violet);}
.split{display:flex;width:100%;height:100%;gap:8px;}
.split > div{flex:1;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:800;}
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">🎮</div>
      <div>
        <h1>ساحة الألعاب</h1>
        <span id="gameCount">تحميل...</span>
      </div>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab active" data-cat="all">الكل</div>
    <div class="tab" data-cat="single">فردي 🧠</div>
    <div class="tab" data-cat="two">ثنائي 🤝</div>
    <div class="tab" data-cat="both">تدعم الاثنين</div>
  </div>
  <div class="grid" id="gameGrid"></div>
</div>

<div id="gameScreen">
  <div class="game-topbar">
    <button id="backBtn">➜ رجوع</button>
    <h2 id="gameTitle">اسم اللعبة</h2>
    <div style="display:flex;align-items:center;gap:8px;">
      <div id="scoreDisplay"></div>
      <button id="howBtn" title="إزاي ألعب؟">❓</button>
    </div>
  </div>
  <div id="gameContainer"></div>
</div>

<div id="howOverlay">
  <div class="result-card">
    <div class="emoji" id="howEmoji">❓</div>
    <h2 id="howTitle">إزاي تلعب</h2>
    <p id="howText" style="white-space:pre-line; text-align:right; line-height:1.7;"></p>
    <div class="result-btns">
      <button class="btn btn-primary" id="howCloseBtn">تمام، يلا نلعب</button>
    </div>
  </div>
</div>

<div id="resultOverlay">
  <div class="result-card">
    <div class="emoji" id="resultEmoji">🏆</div>
    <h2 id="resultTitle">فزت!</h2>
    <p id="resultMsg">تفاصيل النتيجة هنا</p>
    <div class="result-btns">
      <button class="btn btn-secondary" id="resultMenuBtn">القائمة</button>
      <button class="btn btn-primary" id="resultReplayBtn">العب تاني</button>
    </div>
  </div>
</div>

<script>
// ===================== SHARED HELPERS =====================
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}
function rand(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}:${s<10?'0':''}${s}`;
}

const GAMES = [];

// ===================== 1. XO (تيك تاك تو) =====================
GAMES.push({
  id:'xo', name:'إكس أو', icon:'❌', color:'linear-gradient(135deg,#2be6d8,#8b7bff)', category:'both',
  how:'اللعبة من 3 في 3 مربعات.\nكل لاعب بيحط علامته (❌ أو ⭕) في مربع فاضي بالتبادل.\nأول واحد يعمل خط كامل (أفقي أو رأسي أو قطري) بعلامته يكسب.\nفيه زر فوق تقدر تبدّل بيه بين اللعب ضد الكمبيوتر أو مع صحابك على نفس التابلت.',
  init(container, api){
    let mode = 'ai'; // 'ai' | 'pvp'
    let board, turn, over, scores;
    board = Array(9).fill(null); turn='X'; over=false; scores={X:0,O:0};

    const wrap = el('div','pill-row');
    const modeBtn = el('button','btn btn-secondary',''); modeBtn.style.flex='0 0 auto'; modeBtn.style.padding='9px 16px';
    wrap.appendChild(modeBtn);
    const scoreP = el('div','info-pill', `❌ <b id="xoScoreX">0</b> &nbsp;|&nbsp; ⭕ <b id="xoScoreO">0</b>`);
    wrap.appendChild(scoreP);
    container.appendChild(wrap);

    const status = el('div','info-pill','');
    container.appendChild(status);

    const grid = el('div','grid-box');
    grid.style.gridTemplateColumns = 'repeat(3, 84px)';
    grid.style.gridTemplateRows = 'repeat(3, 84px)';
    container.appendChild(grid);

    const cells = [];
    for(let i=0;i<9;i++){
      const c = el('button','tile-btn'); c.style.fontSize='36px';
      c.addEventListener('click', ()=>play(i));
      grid.appendChild(c); cells.push(c);
    }

    function updateModeLabel(){ modeBtn.textContent = mode==='ai' ? '🤖 ضد الكمبيوتر' : '🤝 لاعبين'; }
    modeBtn.addEventListener('click', ()=>{ mode = mode==='ai' ? 'pvp' : 'ai'; updateModeLabel(); reset(); });
    updateModeLabel();

    const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    function checkWin(b){
      for(const [a,b1,c] of LINES){ if(b[a] && b[a]===b[b1] && b[a]===b[c]) return b[a]; }
      if(b.every(x=>x)) return 'draw';
      return null;
    }
    function render(){
      cells.forEach((c,i)=>{ c.textContent = board[i]==='X'?'❌':board[i]==='O'?'⭕':''; });
      status.innerHTML = over ? '' : `دور: ${turn==='X'?'❌':'⭕'} ${mode==='ai' && turn==='O' ? '(الكمبيوتر)':''}`;
      document.getElementById('xoScoreX').textContent = scores.X;
      document.getElementById('xoScoreO').textContent = scores.O;
    }
    function play(i){
      if(over || board[i]) return;
      if(mode==='ai' && turn==='O') return;
      board[i]=turn;
      const res = checkWin(board);
      if(res){ finish(res); return; }
      turn = turn==='X'?'O':'X';
      render();
      if(mode==='ai' && turn==='O' && !over){ setTimeout(aiMove, 400); }
    }
    function aiMove(){
      if(over) return;
      let move = findBest('O') ?? findBest('X') ?? (board[4]===null?4:null) ?? emptyCells()[rand(0,emptyCells().length-1)];
      board[move]='O';
      const res = checkWin(board);
      if(res){ finish(res); return; }
      turn='X'; render();
    }
    function emptyCells(){ return board.map((v,i)=>v?null:i).filter(v=>v!==null); }
    function findBest(sym){
      for(const i of emptyCells()){ const copy=[...board]; copy[i]=sym; if(checkWin(copy)===sym) return i; }
      return null;
    }
    function finish(res){
      over = true;
      if(res==='draw'){ render(); api.showResult('draw','تعادل!','محدش كسب المرة دي 🤝'); return; }
      scores[res]++;
      render();
      if(mode==='ai'){
        api.setScore(`❌ ${scores.X} - ⭕ ${scores.O}`);
        if(res==='X') api.showResult('win','فزت! 🎉', 'كسبت الكمبيوتر، برافو!');
        else api.showResult('lose','خسرت 😅','الكمبيوتر كسب المرة دي');
      } else {
        api.setScore(`❌ ${scores.X} - ⭕ ${scores.O}`);
        api.showResult('win', `فاز ${res==='X'?'❌':'⭕'}!`, 'دور اللاعب التاني يبدأ من أول وجديد');
      }
    }
    function reset(){ board=Array(9).fill(null); turn='X'; over=false; render(); }
    reset();
    api.setScore(`❌ ${scores.X} - ⭕ ${scores.O}`);
    return ()=>{};
  }
});

// ===================== 2. لعبة الذاكرة =====================
GAMES.push({
  id:'memory', name:'لعبة الذاكرة', icon:'🧠', color:'linear-gradient(135deg,#8b7bff,#2be6d8)', category:'single',
  how:'هتلاقي 16 كارت مقلوبة على وشها.\nدوس على كارتين في كل مرة عشان تكشفهم.\nلو الرمزين متطابقين هيفضلوا مكشوفين، ولو مختلفين هيتقلبوا تاني.\nاكشف كل الأزواج بأقل عدد حركات وأسرع وقت ممكن.',
  init(container, api){
    const ICONS = ['🐱','🐶','🦁','🐸','🐵','🦋','🍉','🍕','⚽','🚀','🌟','🎈'];
    const pairs = shuffle(ICONS.slice(0,8).concat(ICONS.slice(0,8)));
    let flipped=[], matched=new Set(), moves=0, timer=0, locked=false;

    const info = el('div','pill-row');
    info.innerHTML = `<div class="info-pill">⏱️ <b id="memTime">0:00</b></div><div class="info-pill">🔁 حركات: <b id="memMoves">0</b></div>`;
    container.appendChild(info);

    const grid = el('div','grid-box');
    grid.style.gridTemplateColumns='repeat(4, 68px)';
    grid.style.gridTemplateRows='repeat(4, 68px)';
    container.appendChild(grid);

    const cards = pairs.map((icon,idx)=>{
      const c = el('button','tile-btn', '❓'); c.style.fontSize='28px'; c.dataset.icon=icon; c.dataset.idx=idx;
      c.addEventListener('click', ()=>flip(idx,c));
      grid.appendChild(c);
      return c;
    });

    const iv = setInterval(()=>{ timer++; document.getElementById('memTime').textContent = fmtTime(timer); }, 1000);

    function flip(idx,c){
      if(locked || matched.has(idx) || flipped.find(f=>f.idx===idx)) return;
      c.textContent = c.dataset.icon;
      flipped.push({idx,c});
      if(flipped.length===2){
        moves++; document.getElementById('memMoves').textContent = moves;
        locked = true;
        const [a,b] = flipped;
        if(a.c.dataset.icon === b.c.dataset.icon){
          matched.add(a.idx); matched.add(b.idx);
          flipped=[]; locked=false;
          if(matched.size===pairs.length){
            clearInterval(iv);
            api.updateBest(-timer);
            api.showResult('win','برافو! 🎉', `خلصت في ${fmtTime(timer)} وبعدد حركات ${moves}`);
          }
        } else {
          setTimeout(()=>{ a.c.textContent='❓'; b.c.textContent='❓'; flipped=[]; locked=false; }, 700);
        }
      }
      api.setScore(`حركات: ${moves}`);
    }
    return ()=> clearInterval(iv);
  }
});

// ===================== 3. الثعبان (Snake) =====================
GAMES.push({
  id:'snake', name:'الثعبان', icon:'🐍', color:'linear-gradient(135deg,#3fe08a,#2be6d8)', category:'single',
  how:'حرّك الثعبان بالأسهم اللي تحت الشاشة (أو أسهم لوحة المفاتيح لو بتستخدم كمبيوتر).\nكل ما تاكل الأكل الأصفر الثعبان بيطول والنقط بتزيد.\nخلي بالك متصدمش في الحيطة ولا في جسمك، لو حصل كده اللعبة بتخلص.',
  init(container, api){
    const SIZE=15, CELL=18;
    const canvas = el('canvas'); canvas.width=SIZE*CELL; canvas.height=SIZE*CELL;
    container.appendChild(canvas);
    const ctx = canvas.getContext('2d');

    const dpad = el('div','dpad');
    dpad.innerHTML = `<span></span><button data-d="up">⬆️</button><span></span>
      <button data-d="left">⬅️</button><span></span><button data-d="right">➡️</button>
      <span></span><button data-d="down">⬇️</button><span></span>`;
    container.appendChild(dpad);

    let snake, dir, nextDir, food, score, dead, speed, loopId;
    function reset(){
      snake=[{x:7,y:7},{x:6,y:7},{x:5,y:7}]; dir='right'; nextDir='right';
      food=spawnFood(); score=0; dead=false; speed=160;
      api.setScore(`النقاط: ${score}`);
      scheduleLoop();
    }
    function spawnFood(){
      let f;
      do{ f={x:rand(0,SIZE-1),y:rand(0,SIZE-1)}; } while(snake.some(s=>s.x===f.x&&s.y===f.y));
      return f;
    }
    function scheduleLoop(){
      clearTimeout(loopId);
      loopId = setTimeout(()=>{ tick(); if(!dead) scheduleLoop(); }, speed);
    }
    function tick(){
      dir = nextDir;
      const head = {...snake[0]};
      if(dir==='up') head.y--; if(dir==='down') head.y++; if(dir==='left') head.x--; if(dir==='right') head.x++;
      if(head.x<0||head.x>=SIZE||head.y<0||head.y>=SIZE||snake.some(s=>s.x===head.x&&s.y===head.y)){
        dead=true; api.updateBest(score);
        api.showResult('lose','خسرت! 💥', `طولك كان ${snake.length} — نقاطك: ${score}`);
        draw(); return;
      }
      snake.unshift(head);
      if(head.x===food.x && head.y===food.y){
        score += 10; api.setScore(`النقاط: ${score}`); food=spawnFood();
        speed = Math.max(70, speed-4);
      } else {
        snake.pop();
      }
      draw();
    }
    function draw(){
      ctx.fillStyle='#1b1640'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#ffcd3c'; ctx.beginPath();
      ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL/2.4, 0, 7); ctx.fill();
      snake.forEach((s,i)=>{
        ctx.fillStyle = i===0 ? '#2be6d8' : '#3fe08a';
        ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
      });
    }
    function setDir(d){
      const opp = {up:'down',down:'up',left:'right',right:'left'};
      if(opp[d] === dir) return;
      nextDir = d;
    }
    dpad.addEventListener('click', e=>{
      const b = e.target.closest('button'); if(!b) return; setDir(b.dataset.d);
    });
    function keyHandler(e){
      const map = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
      if(map[e.key]){ e.preventDefault(); setDir(map[e.key]); }
    }
    document.addEventListener('keydown', keyHandler);
    reset();
    return ()=>{ clearTimeout(loopId); document.removeEventListener('keydown', keyHandler); };
  }
});

// ===================== 4. 2048 =====================
GAMES.push({
  id:'g2048', name:'2048', icon:'🔢', color:'linear-gradient(135deg,#ffcd3c,#ff5d8f)', category:'single',
  how:'اسحب بإصبعك على اللوحة يمين أو شمال أو فوق أو تحت (أو استخدم الأسهم).\nكل الأرقام المتشابهة بتتلم مع بعض وتتضاعف.\nهدفك توصل لرقم 2048! اللعبة بتخلص لو مفيش حركات ممكنة تاني.',
  init(container, api){
    const N=4;
    let grid, score;
    const COLORS = {2:'#3a2f7a',4:'#453a8c',8:'#5847b0',16:'#7457d6',32:'#8b7bff',64:'#2be6d8',128:'#3fe08a',256:'#ffcd3c',512:'#ffb23c',1024:'#ff8a3d',2048:'#ff5d8f'};

    const gridEl = el('div','grid-box'); gridEl.style.gridTemplateColumns=`repeat(${N},70px)`; gridEl.style.gridTemplateRows=`repeat(${N},70px)`;
    container.appendChild(gridEl);
    const hint = el('div','info-pill','اسحب بإصبعك (يمين/شمال/فوق/تحت) عشان تحرك');
    container.appendChild(hint);

    const cellsEls = [];
    for(let i=0;i<N*N;i++){ const c=el('div','tile-btn',''); c.style.fontSize='22px'; cellsEls.push(c); gridEl.appendChild(c); }

    function reset(){
      grid = Array.from({length:N},()=>Array(N).fill(0));
      score = 0; addRandom(); addRandom(); render(); api.setScore(`النقاط: ${score}`);
    }
    function addRandom(){
      const empty=[]; grid.forEach((row,r)=>row.forEach((v,c)=>{ if(!v) empty.push([r,c]); }));
      if(!empty.length) return;
      const [r,c] = empty[rand(0,empty.length-1)];
      grid[r][c] = Math.random()<0.9 ? 2 : 4;
    }
    function render(){
      grid.forEach((row,r)=>row.forEach((v,c)=>{
        const cell = cellsEls[r*N+c];
        cell.textContent = v||'';
        cell.style.background = v ? COLORS[v] || '#ff2d6f' : '#241d54';
        cell.style.color = v>=8 ? '#0c0a1e' : '#f3f1ff';
      }));
    }
    function slideLine(line){
      let vals = line.filter(v=>v);
      for(let i=0;i<vals.length-1;i++){
        if(vals[i]===vals[i+1]){ vals[i]*=2; score+=vals[i]; vals.splice(i+1,1); }
      }
      while(vals.length<N) vals.push(0);
      return vals;
    }
    function move(dir){
      let moved=false;
      const before = JSON.stringify(grid);
      if(dir==='left'){ grid = grid.map(row=>slideLine(row)); }
      if(dir==='right'){ grid = grid.map(row=>slideLine([...row].reverse()).reverse()); }
      if(dir==='up'){
        for(let c=0;c<N;c++){ const col=grid.map(r=>r[c]); const res=slideLine(col); for(let r=0;r<N;r++) grid[r][c]=res[r]; }
      }
      if(dir==='down'){
        for(let c=0;c<N;c++){ const col=grid.map(r=>r[c]).reverse(); const res=slideLine(col).reverse(); for(let r=0;r<N;r++) grid[r][c]=res[r]; }
      }
      moved = JSON.stringify(grid) !== before;
      if(moved){
        addRandom(); render(); api.setScore(`النقاط: ${score}`);
        if(grid.some(row=>row.some(v=>v===2048))){
          api.updateBest(score); api.showResult('win','وصلت 2048! 🎉', `نقاطك: ${score}`); return;
        }
        if(!hasMoves()){ api.updateBest(score); api.showResult('lose','خلصت الحركات 😅', `نقاطك النهائية: ${score}`); }
      }
    }
    function hasMoves(){
      for(let r=0;r<N;r++) for(let c=0;c<N;c++){
        if(!grid[r][c]) return true;
        if(c<N-1 && grid[r][c]===grid[r][c+1]) return true;
        if(r<N-1 && grid[r][c]===grid[r+1][c]) return true;
      }
      return false;
    }
    function keyHandler(e){
      const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
      if(map[e.key]){ e.preventDefault(); move(map[e.key]); }
    }
    document.addEventListener('keydown', keyHandler);
    let sx,sy;
    function touchStart(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }
    function touchEnd(e){
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      if(Math.abs(dx)<20 && Math.abs(dy)<20) return;
      if(Math.abs(dx) > Math.abs(dy)) move(dx>0?'right':'left'); else move(dy>0?'down':'up');
    }
    gridEl.addEventListener('touchstart', touchStart);
    gridEl.addEventListener('touchend', touchEnd);
    reset();
    return ()=>{
      document.removeEventListener('keydown', keyHandler);
      gridEl.removeEventListener('touchstart', touchStart);
      gridEl.removeEventListener('touchend', touchEnd);
    };
  }
});

GAMES.push({

  init(container, api){

      {name:'red', bg:'#ff5d5d', bright:'#ff9d9d'},
      {name:'blue', bg:'#2be6d8', bright:'#8ff5ee'},
      {name:'yellow', bg:'#ffcd3c', bright:'#ffe28a'},
      {name:'green', bg:'#3fe08a', bright:'#8bf0bb'}
    ];
    let sequence=[], playerStep=0, level=0, accepting=false;

    const status = el('div','info-pill','بص وسمع كويس، وبعدين كرر التتابع');
    container.appendChild(status);
    const gridEl = el('div','grid-box'); gridEl.style.gridTemplateColumns='repeat(2,100px)'; gridEl.style.gridTemplateRows='repeat(2,100px)';
    container.appendChild(gridEl);
    const pads = COLORS.map((c,i)=>{
      const p = el('button','tile-btn'); p.style.background=c.bg; p.style.borderRadius='20px';
      p.addEventListener('click', ()=>padTap(i));
      gridEl.appendChild(p); return p;
    });
    const startBtn = el('button','btn btn-primary','ابدأ'); startBtn.style.marginTop='8px';
    container.appendChild(startBtn);

    function flash(i, dur=380){
      return new Promise(res=>{
        pads[i].style.background = COLORS[i].bright;
        pads[i].style.boxShadow = `0 0 24px ${COLORS[i].bright}`;
        setTimeout(()=>{ pads[i].style.background = COLORS[i].bg; pads[i].style.boxShadow='none'; res(); }, dur);
      });
    }
    async function playSequence(){
      accepting=false; status.textContent = 'بص كويس...';
      await new Promise(r=>setTimeout(r,400));
      for(const s of sequence){ await flash(s); await new Promise(r=>setTimeout(r,180)); }
      playerStep=0; accepting=true; status.textContent = 'دورك! كرر التتابع';
    }
    function padTap(i){
      if(!accepting) return;
      flash(i,200);
      if(sequence[playerStep] === i){
        playerStep++;
        if(playerStep === sequence.length){
          level++; api.setScore(`المستوى: ${level}`);
          accepting=false;
          setTimeout(()=>{ sequence.push(rand(0,3)); playSequence(); }, 500);
        }
      } else {
        accepting=false;
        api.updateBest(level);
        api.showResult('lose','غلط! 😅', `وصلت لمستوى ${level}`);
      }
    }
    function start(){
      sequence=[rand(0,3)]; level=0; api.setScore(`المستوى: ${level}`);
      playSequence();
    }
    startBtn.addEventListener('click', start);
    api.setScore(`المستوى: 0`);
    return ()=>{};
  }
});

GAMES.push({
  id:'puzzle15', name:'لغز الأرقام', icon:'🧩', color:'linear-gradient(135deg,#2be6d8,#3fe08a)', category:'single',
  how:'اللوحة فيها أرقام من 1 لـ15 ومكان فاضي واحد.\nدوس على أي رقم جنب المكان الفاضي عشان ينتقل مكانه.\nرتب الأرقام بالترتيب من 1 لـ15 بأقل عدد حركات ممكن عشان تفوز.',
  init(container, api){
    const N=4;
    let tiles, moves;

    const info = el('div','pill-row'); info.innerHTML = `<div class="info-pill">🔁 حركات: <b id="pzMoves">0</b></div>`;
    container.appendChild(info);
    const gridEl = el('div','grid-box'); gridEl.style.gridTemplateColumns=`repeat(${N},70px)`; gridEl.style.gridTemplateRows=`repeat(${N},70px)`;
    container.appendChild(gridEl);
    const cellsEls = [];
    for(let i=0;i<N*N;i++){ const c=el('button','tile-btn',''); c.style.fontSize='22px'; c.addEventListener('click', ()=>tryMove(i)); cellsEls.push(c); gridEl.appendChild(c); }

    function isSolvable(arr){
      const a = arr.filter(v=>v!==0);
      let inv=0;
      for(let i=0;i<a.length;i++) for(let j=i+1;j<a.length;j++) if(a[i]>a[j]) inv++;
      const blankRow = Math.floor(arr.indexOf(0)/N);
      if(N%2===1) return inv%2===0;
      return (inv + blankRow) % 2 === 1;
    }
    function shuffleTiles(){
      let arr;
      do{ arr = shuffle([...Array(N*N).keys()]); } while(!isSolvable(arr) || isSolved(arr));
      return arr;
    }
    function isSolved(arr){ for(let i=0;i<N*N-1;i++) if(arr[i]!==i+1 && !(i===N*N-1)) {} return arr.slice(0,N*N-1).every((v,i)=>v===i+1) && arr[N*N-1]===0; }
    function render(){
      tiles.forEach((v,i)=>{
        const c = cellsEls[i];
        c.textContent = v===0?'':v;
        c.style.background = v===0 ? 'transparent' : '#241d54';
        c.style.boxShadow = v===0 ? 'none' : '';
      });
      document.getElementById('pzMoves').textContent = moves;
    }
    function tryMove(i){
      const blank = tiles.indexOf(0);
      const r1=Math.floor(i/N), c1=i%N, r2=Math.floor(blank/N), c2=blank%N;
      if(Math.abs(r1-r2)+Math.abs(c1-c2) === 1){
        [tiles[i],tiles[blank]] = [tiles[blank],tiles[i]];
        moves++; render(); api.setScore(`حركات: ${moves}`);
        if(isSolved(tiles)){ api.updateBest(-moves); api.showResult('win','فرقعت اللغز! 🎉', `عدد الحركات: ${moves}`); }
      }
    }
    function reset(){ tiles = shuffleTiles(); moves=0; render(); api.setScore('حركات: 0'); }
    reset();
    return ()=>{};
  }
});

      state='waiting'; box.style.background='#ff5d5d'; box.textContent='استنى اللون يتغير...';

  init(container, api){

    container.appendChild(menu);

    [{label:'🟢 بطيئة',v:1.8},{label:'🟡 عادية',v:2.4},{label:'🔴 سريعة',v:3.3}].forEach(o=>{
      const b = el('button','btn btn-secondary', o.label); b.style.flex='0 0 auto';
      b.addEventListener('click', ()=>{ SPEED=o.v; menu.classList.add('hidden'); gameArea.classList.remove('hidden'); resetBall(1); loop(); });
      menuBtns.appendChild(b);
    });

    gameArea.appendChild(hint);
    const ctx = canvas.getContext('2d');

    let leftY=H/2-PH/2, rightY=H/2-PH/2, ballX=W/2, ballY=H/2, vx=2.4, vy=1.6, scoreL=0, scoreR=0, running=true, raf;

    function resetBall(dir){ ballX=W/2; ballY=H/2; vx = SPEED*dir; vy = (Math.random()<0.5?-1:1)*(SPEED*0.66); }

    function draw(){
      ctx.fillStyle='#1b1640'; ctx.fillRect(0,0,W,H);
      ctx.setLineDash([4,6]); ctx.strokeStyle='#3a3470'; ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);

      ctx.fillStyle='#ffcd3c'; ctx.beginPath(); ctx.arc(ballX,ballY,6,0,7); ctx.fill();
      ctx.fillStyle='#f3f1ff'; ctx.font='bold 18px Cairo';
      ctx.fillText(scoreL, W/2-34, 24); ctx.fillText(scoreR, W/2+20, 24);

    function loop(){
      if(!running) return;
      ballX += vx; ballY += vy;
      if(ballY<6 || ballY>H-6) vy *= -1;
      if(ballX-6 < 4+PW && ballY>leftY && ballY<leftY+PH){ vx = Math.abs(vx)*1.03; ballX=4+PW+6; }

        else rightY = Math.min(H-PH, Math.max(0, y-PH/2));

    canvas.addEventListener('touchstart', handleTouch, {passive:false});

    }
    canvas.addEventListener('mousemove', mouseHandler);
    draw();
    api.setScore('اختار المستوى');
    return ()=>{ running=false; cancelAnimationFrame(raf); canvas.removeEventListener('touchstart',handleTouch); canvas.removeEventListener('touchmove',handleTouch); canvas.removeEventListener('mousemove',mouseHandler); };

GAMES.push({
  id:'checkers', name:'الداما', icon:'⚫', color:'linear-gradient(135deg,#2be6d8,#ff5d8f)', category:'two',
  how:'كل لاعب عنده 12 قطعة (🔵 و🟣).\nدوس على قطعتك عشان تشوف الأماكن اللي تقدر تتحرك لها، وبعدين دوس على المكان.\nلو قدرت تقفز فوق قطعة الخصم لمكان فاضي تاخدها منه. لو قطعتك وصلت لآخر اللوحة بتبقى ملكة وتتحرك في كل الاتجاهات.',
  init(container, api){
    const N=8;
    let board, turn, selected=null, legalTargets=[];

    const status = el('div','info-pill','دور: 🔵 اللاعب 1');
    container.appendChild(status);
    const gridEl = el('div','grid-box'); gridEl.style.gridTemplateColumns=`repeat(${N},32px)`; gridEl.style.gridTemplateRows=`repeat(${N},32px)`;
    gridEl.style.direction='ltr';
    container.appendChild(gridEl);
    const hint = el('div','info-pill','دوس على قطعتك وبعدين على المكان اللي تحب تنقلها له');
    container.appendChild(hint);

    const cellsEls = [];
    function build(){
      board = Array.from({length:N},()=>Array(N).fill(null));
      for(let r=0;r<3;r++) for(let c=0;c<N;c++) if((r+c)%2===1) board[r][c]='A';
      for(let r=N-3;r<N;r++) for(let c=0;c<N;c++) if((r+c)%2===1) board[r][c]='B';
      turn='A'; selected=null; legalTargets=[];
      gridEl.innerHTML=''; cellsEls.length=0;
      for(let r=0;r<N;r++) for(let c=0;c<N;c++){
        const cell = el('button','tile-btn',''); cell.style.borderRadius='4px'; cell.style.fontSize='16px';
        cell.style.background = (r+c)%2===1 ? '#241d54' : '#1b1640';
        cell.addEventListener('click', ()=>onCellClick(r,c));
        gridEl.appendChild(cell); cellsEls.push(cell);
      }
      render();
      api.setScore('دور: 🔵 اللاعب 1');
    }
    function dirs(piece){
      if(piece==='AK'||piece==='BK') return [[1,1],[1,-1],[-1,1],[-1,-1]];
      if(piece==='A') return [[1,1],[1,-1]];
      return [[-1,1],[-1,-1]];
    }
    function owner(piece){ return piece && (piece[0]); }
    function inB(r,c){ return r>=0&&r<N&&c>=0&&c<N; }
    function capturesFor(player){
      const moves=[];
      for(let r=0;r<N;r++) for(let c=0;c<N;c++){
        const p = board[r][c]; if(!p || owner(p)!==player) continue;
        for(const [dr,dc] of dirs(p)){
          const mr=r+dr, mc=c+dc, jr=r+dr*2, jc=c+dc*2;
          if(inB(jr,jc) && board[mr] && board[mr][mc] && owner(board[mr][mc])!==player && !board[jr][jc]){
            moves.push({from:[r,c], to:[jr,jc], cap:[mr,mc]});
          }
        }
      }
      return moves;
    }
    function normalsFor(player){
      const moves=[];
      for(let r=0;r<N;r++) for(let c=0;c<N;c++){
        const p = board[r][c]; if(!p || owner(p)!==player) continue;
        for(const [dr,dc] of dirs(p)){
          const mr=r+dr, mc=c+dc;
          if(inB(mr,mc) && !board[mr][mc]) moves.push({from:[r,c], to:[mr,mc]});
        }
      }
      return moves;
    }
    function legalMovesFor(player){
      const caps = capturesFor(player);
      return caps.length ? caps : normalsFor(player);
    }
    function render(){
      board.forEach((row,r)=>row.forEach((p,c)=>{
        const cell = cellsEls[r*N+c];
        cell.textContent = p ? (p==='A'?'🔵':p==='B'?'🟣':p==='AK'?'👑':'♛') : '';
        if(p==='AK') cell.textContent='🔵👑'; if(p==='BK') cell.textContent='🟣👑';
        cell.style.outline = (selected && selected[0]===r && selected[1]===c) ? '3px solid #ffcd3c' : 'none';
        cell.style.boxShadow = legalTargets.some(t=>t[0]===r&&t[1]===c) ? 'inset 0 0 0 3px #3fe08a' : 'none';
      }));
    }
    function onCellClick(r,c){
      const all = legalMovesFor(turn);
      const forced = capturesFor(turn).length>0;
      if(selected){
        const mv = all.find(m=>m.from[0]===selected[0]&&m.from[1]===selected[1]&&m.to[0]===r&&m.to[1]===c);
        if(mv){ doMove(mv); return; }
      }
      const p = board[r][c];
      if(p && owner(p)===turn){
        const myMoves = all.filter(m=>m.from[0]===r&&m.from[1]===c);
        if(myMoves.length){ selected=[r,c]; legalTargets = myMoves.map(m=>m.to); render(); return; }
      }
      selected=null; legalTargets=[]; render();
    }
    function doMove(mv){
      const [fr,fc]=mv.from, [tr,tc]=mv.to;
      let piece = board[fr][fc];
      board[fr][fc]=null;
      if(mv.cap) board[mv.cap[0]][mv.cap[1]]=null;
      if(piece==='A' && tr===N-1) piece='AK';
      if(piece==='B' && tr===0) piece='BK';
      board[tr][tc]=piece;
      selected=null; legalTargets=[];
      if(mv.cap){
        const further = capturesFor(turn).filter(m=>m.from[0]===tr&&m.from[1]===tc);
        if(further.length){ selected=[tr,tc]; legalTargets = further.map(m=>m.to); render(); return; }
      }
      const oppCount = board.flat().filter(p=>p && owner(p) !== turn).length;
      turn = turn==='A'?'B':'A';
      const oppLegal = legalMovesFor(turn);
      render();
      const remainingOpp = board.flat().filter(p=>p && owner(p)===turn).length;
      if(remainingOpp===0 || oppLegal.length===0){
        api.showResult('win', `فاز ${turn==='A'?'🟣 اللاعب 2':'🔵 اللاعب 1'}!`, 'الخصم مالوش حركات متاحة');
        return;
      }
      status.textContent = `دور: ${turn==='A'?'🔵 اللاعب 1':'🟣 اللاعب 2'}`;
      api.setScore(`دور: ${turn==='A'?'🔵 اللاعب 1':'🟣 اللاعب 2'}`);
    }
    build();
    return ()=>{};
  }
});

    menu.innerHTML = '<div class="info-pill">اختار حجم البحر</div>';
    container.appendChild(menu);
    const menuBtns = el('div','pill-row'); menu.appendChild(menuBtns);
    const gameArea = el('div','hidden'); gameArea.style.flexDirection='column'; gameArea.style.alignItems='center'; gameArea.style.gap='10px'; gameArea.style.display='flex'; gameArea.style.width='100%';
    container.appendChild(gameArea);
    [{label:'🟢 صغير 6×6',v:'small'},{label:'🟡 عادي 8×8',v:'normal'},{label:'🔴 كبير 10×10',v:'big'}].forEach(o=>{
      const b = el('button','btn btn-secondary', o.label); b.style.flex='0 0 auto';
      b.addEventListener('click', ()=>{ const lv=LEVELS[o.v]; N=lv.N; shipSizes=lv.ships; menu.classList.add('hidden'); gameArea.classList.remove('hidden'); setupGame(); });
      menuBtns.appendChild(b);
    });

    const passScreen = el('div','pill-row'); passScreen.style.flexDirection='column'; passScreen.style.alignItems='center'; passScreen.style.gap='10px';
    gameArea.appendChild(passScreen);
    const passMsg = el('div','info-pill','');
    const passBtn = el('button','btn btn-primary','جاهز! ');
    passScreen.appendChild(passMsg); passScreen.appendChild(passBtn);

    const playScreen = el('div','hidden'); playScreen.style.flexDirection='column'; playScreen.style.alignItems='center'; playScreen.style.gap='8px'; playScreen.style.display='flex';
    gameArea.appendChild(playScreen);
    const statusP = el('div','info-pill','');
    playScreen.appendChild(statusP);
    const shipsLeftP = el('div','info-pill','');
    playScreen.appendChild(shipsLeftP);
    const gridEl = el('div','grid-box'); gridEl.style.direction='ltr';
    playScreen.appendChild(gridEl);

    function emptyBoard(){ return Array.from({length:N},()=>Array(N).fill(null)); }
    function placeShips(){
      const b = emptyBoard();
      let id=0;
      for(const size of shipSizes){
        let placed=false, tries=0;
        while(!placed && tries<200){
          tries++;
          const horiz = Math.random()<0.5;
          const r = rand(0, N-1), c = rand(0, N-1);
          const cells = [];
          let ok=true;
          for(let i=0;i<size;i++){
            const rr = horiz?r:r+i, cc = horiz?c+i:c;
            if(!inB(rr,cc) || b[rr][cc]){ ok=false; break; }
            cells.push([rr,cc]);
          }
          if(ok){ cells.forEach(([rr,cc])=>b[rr][cc]='S'+id); placed=true; id++; }
        }
      }
      return b;
    }
    function inB(r,c){ return r>=0&&r<N&&c>=0&&c<N; }
    function setupGame(){
      boards = { A: placeShips(), B: placeShips() };
      current='A'; over=false;
      showPassScreen();
    }
    function countShipsLeft(target){
      const b = boards[target];
      const remaining = new Set();
      for(let r=0;r<N;r++) for(let c=0;c<N;c++){
        if(b[r][c] && b[r][c] !== 'X' && b[r][c] !== 'M') remaining.add(b[r][c]);
      }
      return remaining.size;
    }
    function showPassScreen(){
      playScreen.classList.add('hidden');
      passMsg.textContent = `مرر التابلت للاعب ${current==='A'?'1 🔵':'2 🟣'} — دوسوا جاهز لما تكونوا مستعدين`;
      passBtn.textContent = `اللاعب ${current==='A'?'1':'2'} جاهز`;
      passScreen.classList.remove('hidden');
    }
    passBtn.addEventListener('click', ()=>{
      passScreen.classList.add('hidden');
      playScreen.classList.remove('hidden');
      buildGrid();
    });
    function buildGrid(){
      const target = current==='A' ? 'B' : 'A'; // attacking opponent's board
      const CELL = N<=6?38:N<=8?30:24;
      gridEl.style.gridTemplateColumns = `repeat(${N},${CELL}px)`;
      gridEl.style.gridTemplateRows = `repeat(${N},${CELL}px)`;
      gridEl.innerHTML='';
      statusP.textContent = `دور اللاعب ${current==='A'?'1 🔵':'2 🟣'} — دوس عشان تضرب بحر الخصم`;
      shipsLeftP.textContent = `سفن الخصم المتبقية: ${countShipsLeft(target)}`;
      const b = boards[target];
      for(let r=0;r<N;r++) for(let c=0;c<N;c++){
        const cell = el('button','tile-btn',''); cell.style.fontSize = N>8?'11px':'14px';
        const val = b[r][c];
        if(val==='X'){ cell.textContent='💥'; cell.style.background='#ff5d5d'; cell.disabled=true; }
        else if(val==='M'){ cell.textContent='〜'; cell.style.background='#241d54'; cell.disabled=true; }
        else { cell.style.background='#1b1640'; cell.addEventListener('click', ()=>fire(target,r,c)); }
        gridEl.appendChild(cell);
      }
    }
    function fire(target, r, c){
      if(over) return;
      const b = boards[target];
      const val = b[r][c];
      if(typeof val === 'string' && val.startsWith('S')){
        b[r][c] = 'X';
        if(countShipsLeft(target) === 0){
          over = true;
          api.showResult('win', `فاز اللاعب ${current==='A'?'1 🔵':'2 🟣'}!`, 'غرق كل سفن الخصم! 🎉');
          return;
        }
      } else {
        b[r][c] = 'M';
      }
      current = current==='A' ? 'B' : 'A';
      api.setScore(`دور اللاعب ${current==='A'?'1':'2'}`);
      showPassScreen();
    }
    api.setScore('اختار المستوى');
    return ()=>{};
  }
});

// ===================== 20. برج الحكماء (فردي) =====================
GAMES.push({
  id:'hanoi', name:'برج الحكماء', icon:'🗼', color:'linear-gradient(135deg,#ffcd3c,#8b7bff)', category:'single',
  how:'اختار عدد الأقراص.\nدوس على أي عمود عشان تختار أعلى قرص فيه، وبعدين دوس على العمود اللي عايز تنقله له.\nمينفعش تحط قرص كبير فوق قرص أصغر منه. انقل كل الأقراص للعمود الأخير بأقل عدد حركات.',
  init(container, api){
    let n=4, pegs, moves=0, selected=null, minMoves;

    const menu = el('div','pill-row');
    menu.innerHTML = '<div class="info-pill">اختار عدد الأقراص (الصعوبة)</div>';
    container.appendChild(menu);
    const menuBtns = el('div','pill-row'); menu.appendChild(menuBtns);
    const gameArea = el('div','hidden'); gameArea.style.flexDirection='column'; gameArea.style.alignItems='center'; gameArea.style.gap='10px'; gameArea.style.display='flex'; gameArea.style.width='100%';
    container.appendChild(gameArea);
    [{label:'🟢 سهل (3 أقراص)',v:3},{label:'🟡 عادي (4 أقراص)',v:4},{label:'🔴 صعب (5 أقراص)',v:5},{label:'🔥 خبير (6 أقراص)',v:6}].forEach(o=>{
      const b = el('button','btn btn-secondary', o.label); b.style.flex='0 0 auto';
      b.addEventListener('click', ()=>{ n=o.v; menu.classList.add('hidden'); gameArea.classList.remove('hidden'); reset(); });
      menuBtns.appendChild(b);
    });

    const info = el('div','pill-row');
    info.innerHTML = `<div class="info-pill">🔁 حركات: <b id="hnMoves">0</b></div><div class="info-pill">🎯 أقل حركات ممكنة: <b id="hnMin">-</b></div>`;
    gameArea.appendChild(info);
    const hint = el('div','info-pill','دوس على أي عمود لتختار أعلى قرص، وبعدين دوس على العمود اللي تحب تنقله له');
    gameArea.appendChild(hint);
    const pegsWrap = el('div'); pegsWrap.style.display='flex'; pegsWrap.style.gap='14px'; pegsWrap.style.alignItems='flex-end'; pegsWrap.style.height='170px';
    gameArea.appendChild(pegsWrap);

    const COLORS = ['#ff5d8f','#ffcd3c','#3fe08a','#2be6d8','#8b7bff','#ff8a3d'];
    const pegEls = [];
    function buildPegs(){
      pegsWrap.innerHTML=''; pegEls.length=0;
      for(let i=0;i<3;i++){
        const peg = el('div'); peg.style.width='100px'; peg.style.height='160px'; peg.style.background='#1b1640';
        peg.style.borderRadius='10px'; peg.style.display='flex'; peg.style.flexDirection='column-reverse';
        peg.style.alignItems='center'; peg.style.justifyContent='flex-start'; peg.style.padding='4px'; peg.style.gap='3px';
        peg.style.cursor='pointer'; peg.style.border='2px solid transparent';
        peg.addEventListener('click', ()=>onPegClick(i));
        pegsWrap.appendChild(peg); pegEls.push(peg);
      }
    }
    function render(){
      pegEls.forEach((peg,i)=>{
        peg.innerHTML='';
        peg.style.borderColor = selected===i ? '#ffcd3c' : 'transparent';
        pegs[i].forEach(size=>{
          const disk = el('div', '', String(size));
          disk.style.width = (24 + size*11)+'px'; disk.style.height='16px'; disk.style.borderRadius='8px';
          disk.style.background = COLORS[(size-1)%COLORS.length]; disk.style.color='#0c0a1e'; disk.style.fontWeight='800';
          disk.style.fontSize='11px'; disk.style.display='flex'; disk.style.alignItems='center'; disk.style.justifyContent='center';
          peg.appendChild(disk);
        });
      });
      document.getElementById('hnMoves').textContent = moves;
    }
    function onPegClick(i){
      if(selected===null){
        if(pegs[i].length) selected=i;
        render(); return;
      }
      if(selected===i){ selected=null; render(); return; }
      const from=selected, to=i;
      const moving = pegs[from][pegs[from].length-1];
      const destTop = pegs[to][pegs[to].length-1];
      if(destTop===undefined || moving<destTop){
        pegs[to].push(pegs[from].pop());
        moves++;
        selected=null; render();
        if(pegs[2].length===n){
          api.updateBest(-moves);
          const perfect = moves===minMoves;
          api.showResult('win', perfect? 'مثالي! 🏆':'وصلت! 🎉', `عدد حركاتك: ${moves} (أقل عدد ممكن: ${minMoves})`);
        }
      } else {
        selected=i; render();
      }
    }
    function reset(){
      pegs = [Array.from({length:n},(_,idx)=>n-idx), [], []];
      moves=0; selected=null; minMoves = Math.pow(2,n)-1;
      buildPegs(); render();
      document.getElementById('hnMin').textContent = minMoves;
      api.setScore(`حركات: 0`);
    }
    api.setScore('اختار المستوى');
    return ()=>{};
  }
});

// ===================== 21. تصويب كرة السلة (فردي) =====================
GAMES.push({
  id:'basketball', name:'تصويب السلة', icon:'🏀', color:'linear-gradient(135deg,#ff8a3d,#ffcd3c)', category:'single',
  how:'اختار مدى بُعد الرمية.\nهتلاقي مؤشر بيتحرك يمين وشمال على شريط.\nدوس على زرار صوّب لما المؤشر يكون في المنطقة الخضرا عشان تسجل. عندك 5 رميات، سجل أكبر عدد ممكن.',
  init(container, api){
    const LEVELS = { easy:{zone:34, speed:1.6}, medium:{zone:22, speed:2.3}, hard:{zone:13, speed:3.1} };
    let zoneWidth, speed, pos=0, dir=1, raf=null, shotsLeft=5, made=0, zoneStart, running=false;

    const menu = el('div','pill-row');
    menu.innerHTML = '<div class="info-pill">اختار مستوى التصويب</div>';
    container.appendChild(menu);
    const menuBtns = el('div','pill-row'); menu.appendChild(menuBtns);
    const gameArea = el('div','hidden'); gameArea.style.flexDirection='column'; gameArea.style.alignItems='center'; gameArea.style.gap='12px'; gameArea.style.display='flex'; gameArea.style.width='100%';
    container.appendChild(gameArea);
    [{label:'🟢 قريب',v:'easy'},{label:'🟡 متوسط',v:'medium'},{label:'🔴 بعيد',v:'hard'}].forEach(o=>{
      const b = el('button','btn btn-secondary', o.label); b.style.flex='0 0 auto';
      b.addEventListener('click', ()=>{ const lv=LEVELS[o.v]; zoneWidth=lv.zone; speed=lv.speed; menu.classList.add('hidden'); gameArea.classList.remove('hidden'); reset(); });
      menuBtns.appendChild(b);
    });

    const info = el('div','pill-row');
    info.innerHTML = `<div class="info-pill">🏀 رميات متبقية: <b id="bbShots">5</b></div><div class="info-pill">🎯 هدف: <b id="bbMade">0</b></div>`;
    gameArea.appendChild(info);
    const hint = el('div','info-pill','دوس لما المؤشر يبقى في المنطقة الخضرا');
    gameArea.appendChild(hint);

    const barWrap = el('div'); barWrap.style.position='relative'; barWrap.style.width='280px'; barWrap.style.height='36px';
    barWrap.style.background='#241d54'; barWrap.style.borderRadius='18px'; barWrap.style.overflow='hidden';
    gameArea.appendChild(barWrap);
    const zoneEl = el('div'); zoneEl.style.position='absolute'; zoneEl.style.top='0'; zoneEl.style.height='100%'; zoneEl.style.background='rgba(63,224,138,.45)';
    barWrap.appendChild(zoneEl);
    const marker = el('div'); marker.style.position='absolute'; marker.style.top='2px'; marker.style.width='6px'; marker.style.height='32px'; marker.style.background='#ffcd3c'; marker.style.borderRadius='3px';
    barWrap.appendChild(marker);

    const shootBtn = el('button','btn btn-primary','🏀 صوّب!');
    gameArea.appendChild(shootBtn);

    function placeZone(){
      zoneStart = rand(5, 95-zoneWidth);
      zoneEl.style.left = zoneStart+'%'; zoneEl.style.width = zoneWidth+'%';
    }
    function loop(){
      pos += dir*speed;
      if(pos>=100){ pos=100; dir=-1; }
      if(pos<=0){ pos=0; dir=1; }
      marker.style.left = `calc(${pos}% - 3px)`;
      raf = requestAnimationFrame(loop);
    }
    function shoot(){
      if(!running || shotsLeft<=0) return;
      const hit = pos >= zoneStart && pos <= zoneStart+zoneWidth;
      if(hit){ made++; hint.textContent='🔥 نااايس! سلة!'; } else { hint.textContent='😅 معدية، جرب تاني'; }
      document.getElementById('bbMade').textContent = made;
      shotsLeft--;
      document.getElementById('bbShots').textContent = shotsLeft;
      api.setScore(`🎯 ${made}/5`);
      if(shotsLeft<=0){
        running=false; cancelAnimationFrame(raf);
        api.updateBest(made);
        api.showResult(made>=3?'win':'draw', made>=3?'شوطر! 🏆':'خلصت الرميات', `سجلت ${made} من 5 تصويبات`);
        return;
      }
      placeZone();
    }
    shootBtn.addEventListener('click', shoot);
    function reset(){
      shotsLeft=5; made=0; pos=0; dir=1; running=true;
      document.getElementById('bbShots').textContent=5; document.getElementById('bbMade').textContent=0;
      placeZone(); cancelAnimationFrame(raf); loop();
      api.setScore('🎯 0/5');
    }
    api.setScore('اختار المستوى');
    return ()=>{ running=false; cancelAnimationFrame(raf); };
  }
});

</script>
<script>
// ===================== HUB CONTROLLER =====================
const gameGrid = document.getElementById('gameGrid');
const gameScreen = document.getElementById('gameScreen');
const gameContainer = document.getElementById('gameContainer');
const gameTitleEl = document.getElementById('gameTitle');
const scoreDisplay = document.getElementById('scoreDisplay');
const backBtn = document.getElementById('backBtn');
const resultOverlay = document.getElementById('resultOverlay');
const resultEmoji = document.getElementById('resultEmoji');
const resultTitle = document.getElementById('resultTitle');
const resultMsg = document.getElementById('resultMsg');
const resultMenuBtn = document.getElementById('resultMenuBtn');
const resultReplayBtn = document.getElementById('resultReplayBtn');
const gameCountEl = document.getElementById('gameCount');
const howBtn = document.getElementById('howBtn');
const howOverlay = document.getElementById('howOverlay');
const howTitle = document.getElementById('howTitle');
const howText = document.getElementById('howText');
const howCloseBtn = document.getElementById('howCloseBtn');

const bestScores = {}; // in-memory only, per session
let currentGame = null;
let currentCleanup = null;
let currentCategory = 'all';

const CAT_LABEL = { single: 'فردي', two: 'ثنائي', both: 'الاثنين' };
const CAT_TAGCLASS = { single: 'single', two: 'two', both: 'both' };

function renderGrid(){
  gameGrid.innerHTML = '';
  const list = GAMES.filter(g => currentCategory === 'all' ? true : (g.category === currentCategory || (currentCategory!=='both' && g.category==='both')) );
  list.forEach(g => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.borderColor = 'transparent';
    const best = bestScores[g.id];
    card.innerHTML = `
      ${best ? `<div class="best">🏅 ${best}</div>` : ''}
      <div class="icon-tile" style="background:${g.color}">${g.icon}</div>
      <h3>${g.name}</h3>
      <span class="tag ${CAT_TAGCLASS[g.category]}">${CAT_LABEL[g.category]}</span>
    `;
    card.addEventListener('click', () => openGame(g));
    gameGrid.appendChild(card);
  });
  gameCountEl.textContent = `${GAMES.length} لعبة متاحة`;
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if(!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentCategory = tab.dataset.cat;
  renderGrid();
});

function openGame(g){
  currentGame = g;
  gameTitleEl.textContent = g.name;
  scoreDisplay.textContent = '';
  gameContainer.innerHTML = '';
  gameScreen.classList.add('open');

  const api = makeAPI(g);
  currentCleanup = g.init(gameContainer, api) || null;

  if(g.how){
    howTitle.textContent = `إزاي تلعب ${g.name}؟`;
    howText.textContent = g.how;
    howOverlay.classList.add('show');
  }
}

howBtn.addEventListener('click', () => {
  if(!currentGame || !currentGame.how) return;
  howTitle.textContent = `إزاي تلعب ${currentGame.name}؟`;
  howText.textContent = currentGame.how;
  howOverlay.classList.add('show');
});
howCloseBtn.addEventListener('click', () => howOverlay.classList.remove('show'));

function closeGame(){
  gameScreen.classList.remove('open');
  resultOverlay.classList.remove('show');
  howOverlay.classList.remove('show');
  if(typeof currentCleanup === 'function'){ try{ currentCleanup(); }catch(e){} }
  currentCleanup = null;
  setTimeout(() => { gameContainer.innerHTML=''; }, 250);
  renderGrid();
}

backBtn.addEventListener('click', closeGame);
resultMenuBtn.addEventListener('click', closeGame);
resultReplayBtn.addEventListener('click', () => {
  resultOverlay.classList.remove('show');
  if(typeof currentCleanup === 'function'){ try{ currentCleanup(); }catch(e){} }
  gameContainer.innerHTML = '';
  const api = makeAPI(currentGame);
  currentCleanup = currentGame.init(gameContainer, api) || null;
});

function makeAPI(g){
  return {
    setScore(text){ scoreDisplay.textContent = text; },
    updateBest(value){
      const prev = bestScores[g.id];
      if(prev === undefined || value > prev){ bestScores[g.id] = value; }
    },
    getBest(){ return bestScores[g.id]; },
    showResult(kind, title, msg){
      // kind: 'win' | 'lose' | 'draw'
      resultEmoji.textContent = kind === 'win' ? '🏆' : kind === 'lose' ? '💥' : '🤝';
      resultTitle.textContent = title;
      resultMsg.textContent = msg;
      resultOverlay.classList.add('show');
    }
  };
}

renderGrid();

</script>
</body>
